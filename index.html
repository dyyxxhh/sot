<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ec">
  <meta name="description" content="在浏览器里制作、验证和补全文件时间戳。原文件不上传。">
  <title>Sign of Time · 文件时间戳</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/app.webmanifest">
  <link rel="stylesheet" href="/src/style.css">
  <script defer src="/vendor/opentimestamps.min.js"></script>
  <script type="module" src="/src/app.mjs"></script>
</head>
<body>
  <header class="top"><a href="/" class="brand"><span aria-hidden="true">◷</span> SIGN OF TIME</a><button id="open-settings" type="button" aria-haspopup="dialog">设置</button></header>
  <main>
    <section id="home" aria-labelledby="home-title">
      <div class="hero"><h1 id="home-title">文件时间戳</h1><p>证明这版文件最晚何时已存在。原件不上传，凭证可独立验证。</p></div>
      <nav class="entries" aria-label="工具入口">
        <button type="button" data-view="create">制作</button>
        <button type="button" data-view="verify">验证</button>
        <button type="button" data-view="complete">补全</button>
      </nav>
    </section>
    <section id="tool" class="card" hidden>
      <div class="tool-head"><button id="back" type="button">← 返回</button><h1 id="tool-title"></h1></div>
      <form id="create" hidden autocomplete="off">
        <label class="field">选择文件 <small>原文件、分离签名或已有时间戳</small><input id="make-input" type="file"></label>
        <div id="make-fields" class="fields" hidden>
          <label class="field" data-field="make-original" hidden>补充原文件 <small>已有时间戳须匹配原文件或签名；.fsot 必须有原件。</small><input id="make-original" type="file"></label>
          <label class="field" data-field="make-signature" hidden>分离签名 <small>由本地签名工具生成，不要选择私钥。</small><input id="make-signature" type="file" accept=".sig,.asc,application/pgp-signature"></label>
          <label class="field">其他已有时间戳 <small>可选；可多选 .tsr 或 .ots。</small><input id="make-existing" type="file" accept=".tsr,.tsa,.ots" multiple></label>
          <fieldset><legend>申请新时间戳 <small>可选，需联网</small></legend>
            <label><input name="authority" type="checkbox" value="digicert" checked> DigiCert</label>
            <label><input name="authority" type="checkbox" value="freetsa" checked> FreeTSA</label>
            <label><input name="authority" type="checkbox" value="ots" checked> OpenTimestamps</label>
          </fieldset>
          <fieldset id="make-targets" hidden><legend>新时间戳打在</legend>
            <label><input name="target" type="radio" value="file"> 原文件</label>
            <label><input name="target" type="radio" value="signature" checked> 分离签名</label>
          </fieldset>
          <fieldset><legend>归档格式</legend>
            <label><input name="kind" type="radio" value="asot" checked> .asot · 仅凭证和可选签名</label>
            <label><input id="make-fsot" name="kind" type="radio" value="fsot" disabled> .fsot · 含原文件</label>
          </fieldset>
          <div class="actions"><button id="make-review" type="button" class="primary">核对制作内容</button></div>
        </div>
        <output id="make-status" class="status" aria-live="polite" tabindex="-1" hidden></output>
        <div class="actions"><button id="make-confirm" type="submit" class="primary" hidden>确认制作</button></div>
      </form>
      <form id="verify" hidden autocomplete="off">
        <label class="field">选择文件 <small>.asot、.fsot、.sig、.tsr 或 .ots</small><input id="verify-input" type="file" accept=".asot,.fsot,.sig,.asc,.tsr,.tsa,.ots"></label>
        <div id="verify-fields" class="fields" hidden>
          <label class="field" data-field="verify-target" hidden>打戳对象（必选） <small>选择当时被打戳的原文件或分离签名。</small><input id="verify-target" type="file"></label>
          <label class="field" data-field="verify-original" hidden>原文件 <small id="verify-original-note"></small><input id="verify-original" type="file"></label>
          <label class="field" data-field="verify-key" hidden>OpenPGP 公钥 <small id="verify-key-note"></small><input id="verify-key" type="file" accept=".asc,.pgp,.gpg,.pub"></label>
          <label class="field" data-field="verify-headers" hidden>可信比特币区块记录 <small>可选。请从你信任的节点取得。</small><input id="verify-headers" type="file" accept=".json"></label>
          <div class="actions"><button id="verify-online" class="primary" type="button" hidden>在线验证</button><button id="verify-local" type="submit">离线验证</button></div>
        </div>
        <section id="verify-summary" class="verification-summary" aria-live="polite" aria-atomic="true" hidden></section>
        <output id="verify-status" class="status" aria-live="polite" hidden></output>
      </form>
      <form id="complete" hidden autocomplete="off">
        <label class="field">选择文件 <small>.ots、.asot 或 .fsot</small><input id="complete-input" type="file" accept=".ots,.asot,.fsot"></label>
        <div id="complete-fields" class="fields" hidden>
          <div class="actions" id="complete-upgrade" hidden><button id="upgrade" class="primary" type="button">确认联网补全 OTS</button></div>
          <label class="field" data-field="complete-signature" hidden>附加分离签名 <small>可选；仅追加，不打戳、不验签。旧时间戳不覆盖新签名。</small><input id="complete-signature" type="file" accept=".sig,.asc,application/pgp-signature"></label>
          <div class="actions" id="complete-attach" hidden><button id="attach" type="button">确认追加签名</button></div>
        </div>
        <output id="complete-status" class="status" aria-live="polite" hidden></output>
      </form>
    </section>
  </main>
  <footer><span>Sign of Time</span><span id="offline-state">离线缓存尚未就绪</span></footer>
  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">设置</h2>
      <label class="field">显示时区
        <select id="display-time-zone">
          <option value="UTC">UTC</option>
          <option value="device">跟随设备</option>
          <option value="Asia/Shanghai">北京时间（Asia/Shanghai）</option>
        </select>
        <small>自动保存在本浏览器，仅影响时间显示，不影响验证或时间差判定。</small>
      </label>
      <div class="settings-actions"><a href="/VERIFY.txt" download>下载验证说明</a><button type="submit" class="primary">完成</button></div>
    </form>
  </dialog>
</body>
</html>
